name: mailstr
description: "Nostr based email service."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.2
  get: ^4.7.2
  google_fonts: ^6.3.2
  http: ^1.4.0
  intl: any
  ndk: ^0.6.0-dev.12
  nip01: ^0.3.0+1
  nip19: ^0.2.0
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  sembast_cache_manager: ^1.0.2
  sembast_web: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  sembast: ^3.8.5+2
  get_storage: ^2.1.1
  nostr_widgets: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/